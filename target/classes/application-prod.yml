# Üretim profili (SPRING_PROFILES_ACTIVE=prod): gizli değerlerin varsayılanı yoktur; eksikse uygulama başlamaz.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
