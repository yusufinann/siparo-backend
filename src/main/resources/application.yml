server:
  port: ${PORT:8080}

spring:
  jackson:
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
  application:
    name: siparo-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Geliştirme varsayılanları; üretimde tüm değerler ortam değişkeniyle verilmelidir (bkz. application-prod.yml).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siparo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siparo}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}

jwt:
  secret: ${JWT_SECRET:super_secret_key_for_development_must_change_in_production_1234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

delivery:
  pin-secret: ${DELIVERY_PIN_SECRET:development_delivery_pin_secret_change_me_1234567890}

siparo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:}
  # QR / davet bağlantılarının açıldığı alan adı (örn. https://siparo.app). Boşsa QR yalnızca uygulama içi derin bağlantı üretir.
  public-web-url: ${PUBLIC_WEB_URL:}
  app-store-url: ${APP_STORE_URL:}
  play-store-url: ${PLAY_STORE_URL:}
  support:
    phone: ${SUPPORT_PHONE:}
    email: ${SUPPORT_EMAIL:}
  # Dış servisler: yapılandırılmadıkça ilgili özellik kapalıdır (sahte akış yoktur).
  push:
    provider: ${PUSH_PROVIDER:none}       # none | expo
    expo:
      access-token: ${EXPO_ACCESS_TOKEN:}
  sms:
    provider: ${SMS_PROVIDER:none}        # none | <sağlayıcı> (SmsSender bean'i gerekir)
  payments:
    provider: ${PAYMENT_PROVIDER:none}    # none | <sağlayıcı> (ödeme ağ geçidi entegrasyonu gerekir)
