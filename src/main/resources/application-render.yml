# Use with prod: SPRING_PROFILES_ACTIVE=prod,render
server:
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    threads:
      max: 30
      min-spare: 2

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 30000
  flyway:
    # New Neon databases must run every migration, starting with V1.
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

siparo:
  uploads:
    # Render Free has no persistent disk: images go to private Neon Object Storage and are served via /uploads/**.
    # Requires AWS_ENDPOINT_URL_S3, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, UPLOADS_S3_BUCKET.
    provider: s3
