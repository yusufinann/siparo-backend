services:
  - type: web
    name: siparo-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/public/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      # Neon direct (non-pooled) JDBC URL without credentials: jdbc:postgresql://HOST/DATABASE?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Comma-separated exact web origins; native mobile clients need no CORS.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DELIVERY_PIN_SECRET
        generateValue: true
      - key: AUTH_RESET_SECRET
        generateValue: true
      # Neon Object Storage: copy endpoint and region exactly from the branch's storage connection details.
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOADS_S3_BUCKET
        value: siparo-images
